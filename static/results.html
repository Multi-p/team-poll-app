<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Poll Results - Live Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 14px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #334155;
      color: #fff;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .poll-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .poll-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .stats-row {
      display: flex;
      gap: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--text-muted);
    }

    .stats-row span strong {
      color: #fff;
    }

    .breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .opt-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .opt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .opt-label {
      font-weight: 600;
      font-size: 15px;
      color: #f1f5f9;
    }

    .opt-count {
      font-weight: 700;
      font-size: 14px;
      color: #94a3b8;
    }

    .progress-bar-bg {
      height: 10px;
      background: #1e293b;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 4px 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      font-size: 12px;
      cursor: pointer;
      color: #94a3b8;
    }

    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      padding: 10px 14px;
      color: #94a3b8;
      font-weight: 600;
      border-bottom: 1px solid var(--card-border);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      color: #e2e8f0;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge-choice {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="brand">
        <h2>📊 Poll Results</h2>
      </div>
      <div class="controls">
        <a href="/" class="btn">🏠 All Polls</a>
        <a id="votePageLink" href="#" class="btn">🗳️ Vote Page</a>
        <button id="copyTeamsBtn" class="btn btn-primary">📋 Copy for Teams</button>
        <button id="refreshBtn" class="btn">🔄 Refresh</button>
      </div>
    </div>

    <!-- Overview Card -->
    <div class="card">
      <h1 id="pollTitle" class="poll-title">Loading results...</h1>
      <p id="pollDesc" class="poll-desc"></p>
      
      <div class="breakdown-list" id="breakdownContainer">
        <!-- Progress Bars -->
      </div>

      <div class="stats-row">
        <span>Total Responses: <strong id="totalCount">0</strong></span>
        <span>Last Refreshed: <strong id="lastRefreshed">--</strong></span>
      </div>
    </div>

    <!-- Voter Details Card -->
    <div class="card">
      <div class="section-header">
        <div class="section-title">Individual Responses</div>
        <div class="filter-chips" id="filterChips">
          <div class="chip active" data-filter="all">All</div>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Response</th>
              <th>Note / Preference</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="voterTableBody">
            <tr>
              <td colspan="4" class="empty-state">No responses yet. Share the poll link to collect votes!</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    let pollId = "";
    let pollData = null;
    let currentFilter = "all";

    // Detect Poll ID from URL
    const path = window.location.pathname;
    const urlParams = new URLSearchParams(window.location.search);
    if (path.startsWith("/r/")) {
      pollId = path.replace("/r/", "").split("/")[0];
    } else if (path.startsWith("/results/")) {
      pollId = path.replace("/results/", "").split("/")[0];
    } else if (urlParams.get("id")) {
      pollId = urlParams.get("id");
    }

    if (pollId) {
      document.getElementById("votePageLink").href = `/p/${pollId}`;
    } else {
      document.getElementById("votePageLink").href = "/";
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    async function fetchResults() {
      try {
        const apiUrl = pollId ? `/api/results/${pollId}` : `/api/results`;
        const res = await fetch(apiUrl);
        if (!res.ok) {
          document.getElementById("pollTitle").textContent = "Poll Not Found";
          document.getElementById("pollDesc").textContent = "The requested poll does not exist or has been deleted.";
          return;
        }
        pollData = await res.json();
        pollId = pollData.id;
        document.getElementById("votePageLink").href = `/p/${pollId}`;
        render();
      } catch (err) {
        console.error(err);
      }
    }

    function render() {
      if (!pollData) return;

      document.getElementById("pollTitle").textContent = pollData.question;
      document.getElementById("pollDesc").textContent = pollData.description || "";
      document.getElementById("totalCount").textContent = pollData.total_votes;
      document.getElementById("lastRefreshed").textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      // Breakdown Cards
      const breakdownBox = document.getElementById("breakdownContainer");
      breakdownBox.innerHTML = "";

      const filterChips = document.getElementById("filterChips");
      filterChips.innerHTML = `<div class="chip ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">All (${pollData.total_votes})</div>`;

      pollData.breakdown.forEach(item => {
        const pct = item.percentage;
        const card = document.createElement("div");
        card.className = "opt-card";
        card.innerHTML = `
          <div class="opt-header">
            <span class="opt-label">${item.label}</span>
            <span class="opt-count">${item.count} (${pct}%)</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${pct}%; background-color: ${item.color || '#3b82f6'};"></div>
          </div>
        `;
        breakdownBox.appendChild(card);

        const chip = document.createElement("div");
        chip.className = `chip ${currentFilter === item.id ? 'active' : ''}`;
        chip.dataset.filter = item.id;
        chip.textContent = `${item.label.split(' ')[0]} (${item.count})`;
        chip.addEventListener("click", () => {
          currentFilter = item.id;
          renderVoterTable();
          updateChipActive();
        });
        filterChips.appendChild(chip);
      });

      filterChips.querySelector('[data-filter="all"]').addEventListener("click", () => {
        currentFilter = "all";
        renderVoterTable();
        updateChipActive();
      });

      renderVoterTable();
    }

    function updateChipActive() {
      document.querySelectorAll(".chip").forEach(c => {
        if (c.dataset.filter === currentFilter) {
          c.classList.add("active");
        } else {
          c.classList.remove("active");
        }
      });
    }

    function renderVoterTable() {
      const tbody = document.getElementById("voterTableBody");
      const votes = pollData.recent_votes || [];

      const filtered = currentFilter === "all" 
        ? votes 
        : votes.filter(v => v.option_id === currentFilter);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No voters in this category yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(v => {
        const optInfo = (pollData.breakdown || []).find(b => b.id === v.option_id);
        const color = optInfo ? optInfo.color : '#3b82f6';
        return `
          <tr>
            <td><strong>${escapeHtml(v.voter_name)}</strong></td>
            <td><span class="badge-choice" style="background: ${color}25; color: ${color}; border: 1px solid ${color}40;">${escapeHtml(v.option_label || v.option_id)}</span></td>
            <td style="color: ${v.comment ? '#f8fafc' : '#64748b'};">${v.comment ? escapeHtml(v.comment) : '—'}</td>
            <td style="color: #64748b; font-size: 13px;">${escapeHtml(v.voted_at || '')}</td>
          </tr>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Teams Summary Formatter
    document.getElementById("copyTeamsBtn").addEventListener("click", () => {
      if (!pollData) return;
      let text = `📊 *Poll Results: ${pollData.question}*\n`;
      text += `Total Responses: ${pollData.total_votes}\n\n`;

      pollData.breakdown.forEach(item => {
        const names = (item.voters || []).map(v => v.comment ? `${v.name} (${v.comment})` : v.name).join(", ");
        text += `${item.label}: ${item.count} (${item.percentage}%)\n`;
        if (names) {
          text += `  └─ ${names}\n`;
        }
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast("Teams summary copied to clipboard!");
      }).catch(() => {
        showToast("Error copying to clipboard");
      });
    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
      fetchResults();
      showToast("Refreshed!");
    });

    setInterval(fetchResults, 5000);
    fetchResults();
  </script>
</body>
</html>
