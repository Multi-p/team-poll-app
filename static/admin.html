<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll Settings & Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .nav-links {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .nav-links a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
    .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #a7f3d0; }
    .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-links">
      <a href="/">← Go to Vote Page</a>
      <a href="/results">📊 View Results</a>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="card">
      <h2>⚙️ Poll Configuration</h2>
      <div class="form-group">
        <label>Poll Question</label>
        <input type="text" id="pollQuestionInput" placeholder="e.g. 🍽️ Are you ready for today's team lunch?">
      </div>

      <div class="form-group">
        <label>Description / Note</label>
        <textarea id="pollDescInput" placeholder="e.g. Please respond by 12:30 PM for table booking."></textarea>
      </div>

      <button id="savePollBtn" class="btn btn-primary">Save Question</button>
    </div>

    <div class="card">
      <h2 style="color: #ef4444;">⚠️ Reset Poll Data</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 16px;">
        Clear all existing votes from the active poll so you can run a fresh poll.
      </p>
      <button id="resetVotesBtn" class="btn btn-danger">Reset All Votes</button>
    </div>
  </div>

  <script>
    const alertBox = document.getElementById("alertBox");

    function showAlert(msg, type="success") {
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = msg;
      alertBox.style.display = "block";
      setTimeout(() => { alertBox.style.display = "none"; }, 3500);
    }

    async function loadCurrent() {
      try {
        const res = await fetch("/api/poll");
        const data = await res.json();
        document.getElementById("pollQuestionInput").value = data.question || "";
        document.getElementById("pollDescInput").value = data.description || "";
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById("savePollBtn").addEventListener("click", async () => {
      const q = document.getElementById("pollQuestionInput").value.trim();
      const d = document.getElementById("pollDescInput").value.trim();
      if (!q) {
        showAlert("Question cannot be empty", "danger");
        return;
      }
      try {
        const res = await fetch("/api/admin/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, description: d })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert(data.message, "success");
        } else {
          showAlert(data.error || "Update failed", "danger");
        }
      } catch (e) {
        showAlert("Error updating poll", "danger");
      }
    });

    document.getElementById("resetVotesBtn").addEventListener("click", async () => {
      if (!confirm("Are you sure you want to clear all votes?")) return;
      try {
        const res = await fetch("/api/admin/reset", { method: "POST" });
        const data = await res.json();
        if (res.ok) {
          showAlert(data.message, "success");
        }
      } catch (e) {
        showAlert("Error resetting votes", "danger");
      }
    });

    loadCurrent();
  </script>
</body>
</html>
